<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80" /> <!-- Bright Tech Green -->
      <stop offset="100%" style="stop-color:#059669" /> <!-- Deep Emerald -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Outer Shape (Representing Structure/Tech/Carbon6) -->
  <path d="M100 20 L173.2 60 L173.2 140 L100 180 L26.8 140 L26.8 60 Z" 
        stroke="url(#mainGradient)" 
        stroke-width="8" 
        stroke-linejoin="round"
        fill="rgba(22, 101, 52, 0.05)" 
        filter="url(#glow)"/>

  <!-- Inner Circuit Traces (Traceability) -->
  <path d="M100 180 L100 100 L173.2 60" 
        stroke="url(#mainGradient)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.8"/>
        
  <path d="M100 100 L26.8 140" 
        stroke="url(#mainGradient)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.6"/>

  <!-- Abstract Leaf Element (Nature/Green) -->
  <path d="M100 100 L100 40 
           Q 130 40, 140 70" 
        stroke="url(#mainGradient)" 
        stroke-width="5" 
        stroke-linecap="round"
        fill="none" />

  <!-- Central Core Node (Data/AI) -->
  <circle cx="100" cy="100" r="10" fill="#FFFFFF" stroke="url(#mainGradient)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Satellite Particles -->
  <circle cx="140" cy="70" r="4" fill="#4ADE80" />
  <circle cx="60" cy="130" r="3" fill="#059669" opacity="0.8" />

</svg>
