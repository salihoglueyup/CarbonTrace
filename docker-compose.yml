# ===================================
# CBAM Guard - Docker Compose
# ===================================
# Geliştirme ve production ortamları için Docker yapılandırması

version: '3.8'

services:
  # =================================
  # Backend (FastAPI)
  # =================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cbam-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./cbam_guard.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =================================
  # Frontend (React/Vite)
  # =================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cbam-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    restart: unless-stopped

  # =================================
  # PostgreSQL (Production için)
  # =================================
  # db:
  #   image: postgres:15-alpine
